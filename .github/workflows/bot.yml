name: Telegram Casting Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */5 * * *'   # запасной вариант, не на круглой минуте

concurrency:
  group: telegram-casting-bot
  cancel-in-progress: false   # новый запуск ждёт, а не убивает работающий

permissions:
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: timeout 340m python bot.py || true

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
